services:

  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: crmdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crmdb}
      POSTGRES_USER: ${DB_USER:-crmuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crmpassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-crmuser} -d ${DB_NAME:-crmdb}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== BACKEND (Spring Boot 3 + Java 21) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-crmdb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-crmuser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-crmpassword}
      APP_JWT_SECRET: ${JWT_SECRET:-sua-chave-secreta-super-forte-e-segura-minimo-256-bits-crm-scanner-2025}
      APP_JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      APP_JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== FRONTEND (React + Vite + Nginx) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ==================== PGADMIN ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@crm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
