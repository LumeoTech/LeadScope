spring:
  application:
    name: crm-backend

  # ==================== BANCO DE DADOS ====================
  datasource:
    # SPRING_DATASOURCE_URL sobrescreve toda a URL (útil em Render/Railway).
    # Se não definido, monta a partir das variáveis individuais.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:6543}/${DB_NAME:postgres}${DB_PARAMS:?sslmode=require&prepareThreshold=0}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  # ==================== FLYWAY (MIGRAÇÕES) ====================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# ==================== SERVIDOR ====================
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# ==================== SWAGGER / OPENAPI ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ==================== JWT ====================
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  google:
    places:
      api-key: ${GOOGLE_MAPS_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==================== RATE LIMIT ====================
bucket4j:
  enabled: true

# ==================== LOGGING ====================
logging:
  level:
    com.crmscanner: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
