name: Keep Backend Alive

on:
  schedule:
    # Dispara a cada 10 minutos para evitar cold start
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          HEALTH_URL="${{ secrets.BACKEND_HEALTH_URL || 'https://leadscope-e8lo.onrender.com/api/health' }}"
          echo "Disparando ping silencioso para: $HEALTH_URL"
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$HEALTH_URL" || echo "failed")
          echo "Status de resposta: $RESPONSE_CODE"
